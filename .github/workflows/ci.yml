name: ci

# Chaque cle de `commands` devient une etape ci-dessous, `secrets_scan` compris :
# ce template ne nomme donc aucun outil, et le scan de secrets est celui que le
# projet a declare. `fetch-depth: 0` lui laisse l'historique complet s'il en veut.

on:
  push:
    branches-ignore:
      - main
  pull_request:


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (frontend-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: install
        run: corepack enable && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium

      - name: check
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check

      - name: lint
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run lint

      - name: format
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run format:check

      - name: build
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run build

      - name: test-unit
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run test:unit

      - name: test-e2e
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run test:e2e

      - name: coverage
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run test:coverage

      - name: smoke
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run test:smoke

      - name: accessibility
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run test:a11y

      - name: architecture
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check:architecture

      - name: design-tokens
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check:tokens

      - name: dead-code
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check:dead-code

      - name: duplication
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check:duplication

      - name: design-limits
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check:design-limits

      - name: comment-policy
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check:comments

      - name: doc-lint
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check:docs

      - name: sast
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check:security

      - name: secrets-scan
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run scan:secrets

      - name: audit
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm audit --audit-level high

      - name: tracker-sync
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: node agent-pipeline/scripts/tracker-sync.mjs

      - name: project-map
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm run project-map -- --check

      - name: map-coverage
        if: ${{ github.event_name == 'pull_request' }}
        run: node agent-pipeline/scripts/map-coverage.mjs

      - name: content
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: pnpm run check:content

      - name: security-scope
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: node agent-pipeline/scripts/security-scan.mjs check

      - name: dast-baseline
        if: ${{ github.event_name == 'pull_request' }}
        run: node agent-pipeline/scripts/security-scan.mjs baseline

      - name: core-tests
        run: node --test "agent-pipeline/test/**/*.test.mjs"

      - name: briefs-sync
        run: node agent-pipeline/scripts/sync-briefs.mjs --check

      - name: profile-sync
        run: node agent-pipeline/scripts/apply-profile.mjs --check

      - name: store-invariants
        run: node agent-pipeline/scripts/store-verify.mjs

      - name: upload-security-and-load-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "security-and-load-evidence"
          if-no-files-found: warn
          path: |
            pipeline/security/reports/**/run.json
