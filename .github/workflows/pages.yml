name: pages

# Publie le site prerendu sur GitHub Pages. Ne rejoue aucune porte : `ci.yml`
# les tient deja sur la meme poussee, et les redoubler ici couterait le double
# sans rien refuser de plus. Ce workflow construit et publie ; s'il echoue, il
# echoue sur le build, pas sur une porte.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Le jeton ne sert qu'a publier. `pages` et `id-token` sont ce que
# `deploy-pages` demande, et rien d'autre n'est accorde.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois, et la derniere gagne. Deux poussees
# rapprochees publieraient sinon dans un ordre que personne ne controle.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: install
        run: corepack enable && pnpm install --frozen-lockfile

      # Le meme `build` que la CI : il prerend les neuf adresses declarees,
      # verifie qu'elles sont toutes ecrites, puis calcule la politique de
      # securite depuis le site construit et l'ecrit dans chaque page. Un
      # build qui ne peut pas la calculer echoue plutot que de publier un
      # site sans politique.
      - name: build
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
