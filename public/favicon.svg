<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Donatien Koffi">
  <!--
    La marque de la barre, reduite a ses initiales : la plaque --accent-plate
    portant --on-accent, en mono capitales grasses, comme `.mark` la rend dans
    src/shared/SiteBar.css. Les deux valeurs sont ecrites en clair ici parce
    qu un fichier de public/ est servi tel quel : il ne traverse ni le build ni
    la feuille de style, et ne peut donc pas lire un jeton.

    --accent-plate en vaut DEUX : #b3271a dans le theme clair, #c93a24 dans le
    sombre. C est le sombre qui est copie ici, et non par hasard : une icone
    d onglet ne suit aucun theme, il faut en choisir une, et la barre d onglets
    est sombre chez la plupart des lecteurs. Le clair y reste lisible.

    La plaque occupe tout le carre plutot qu un rond ou une pastille : a 16 px
    un aplat plein reste lisible la ou une forme decoupee devient une tache.

    Le trace vient d une police monospace du systeme, comme le site : aucune
    police n est chargee, et un onglet ne doit pas attendre un reseau pour
    afficher son icone.
  -->
  <rect x="-1" y="-1" width="34" height="34" fill="#c93a24" />
  <text
    x="16"
    y="16"
    fill="#f8f7f3"
    font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace"
    font-size="14"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
  >DK</text>
</svg>
